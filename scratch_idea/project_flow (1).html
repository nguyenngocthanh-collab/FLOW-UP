  .np * { box-sizing: border-box; }
  .np { font-family: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif; color: ${tt.text}; font-size: 15px; line-height: 1.5; }
  .np button, .np input, .np textarea { font-family: inherit; font-size: inherit; color: inherit; }

  .np-card { background: ${tt.card}; border: 1px solid ${tt.line}; border-radius: 14px; padding: 20px; }
  .np-card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 16px; }
  .np-title { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 16px; font-weight: 600; color: ${tt.ink}; }
  .np-sq { width: 10px; height: 10px; border-radius: 3px; flex: none; }

  .np-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid ${tt.line}; border-radius: 10px; background: #fff; color: ${tt.ink}; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  .np-btn:hover { background: ${tt.indigoSoft}; border-color: #c9caf3; color: ${tt.indigo}; }
  .np-btn.primary { background: ${tt.indigo}; border-color: ${tt.indigo}; color: #fff; box-shadow: 0 8px 18px -8px ${tt.indigo}; }
  .np-btn.primary:hover { background: #4144c4; }
  .np button:focus-visible { outline: 3px solid ${tt.indigoSoft}; outline-offset: 2px; box-shadow: 0 0 0 2px ${tt.indigo}; }

  .np-tile { display: flex; flex-direction: column; justify-content: space-between; width: 100%; min-height: 142px; padding: 18px 20px; text-align: left; background: ${tt.card}; border: 1px solid ${tt.line}; border-radius: 14px; cursor: pointer; transition: background .15s, border-color .15s; }
  .np-tile:hover { border-color: #c9caf3; background: ${tt.field}; }
  .np-tile.new { align-items: center; justify-content: center; gap: 10px; background: ${tt.indigoSoft}; border: 1px dashed ${tt.indigo}; color: ${tt.indigo}; font-weight: 600; }
  .np-tile.new:hover { background: ${tt.indigoSoft}; border-color: #4144c4; color: #4144c4; }
  .np-plus { width: 36px; height: 36px; border-radius: 50%; background: ${tt.indigo}; color: #fff; display: inline-flex; align-items: center; justify-content: center; }
  .np-chip { font-size: 12px; font-weight: 500; color: ${tt.muted}; background: ${tt.field}; border: 1px solid ${tt.line}; border-radius: 6px; padding: 2px 8px; }
  .np-stat { padding: 12px 14px; border: 1px solid ${tt.line}; border-radius: 10px; background: ${tt.field}; }
  .np-stat-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
  .np-note { font-size: 13px; color: ${tt.muted}; }

  .np-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
  .np-grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
  .np-grid-bottom { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; }
  @media (max-width: 1100px) {
    .np-grid { grid-template-columns: 1fr; }
    .np-grid-3 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .np-grid-bottom { grid-template-columns: 1fr; }
  }
  @media (max-width: 640px) {
    .np-grid-3 { grid-template-columns: 1fr; }
  }

  .np * { box-sizing: border-box; }
  .np { font-family: Inter, "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
        color: ${ft.text}; font-size: 15px; line-height: 1.5; }
  .np button, .np input, .np textarea { font-family: inherit; font-size: inherit; color: inherit; }

  .np-nav { display:flex; align-items:center; gap:12px; width:100%; height:42px; padding:0 12px;
            border:0; border-radius:10px; background:transparent; color:${ft.muted};
            font-weight:500; text-align:left; cursor:pointer; transition: background .15s, color .15s; }
  .np-nav:hover { background:#fff; color:${ft.ink}; }
  .np-nav[aria-current="page"] { background:${ft.indigoSoft}; color:${ft.indigo}; font-weight:600; }

  .np-field-head { display:flex; align-items:center; justify-content:space-between; gap:8px; min-height:24px; margin-bottom:6px; }
  .np-field-head label { margin:0; font-size:13px; font-weight:500; color:${ft.text}; cursor:pointer; }

  .np-toolbar { display:inline-flex; align-items:center; gap:2px; background:#fff; border:1px solid ${ft.line};
                border-radius:8px; padding:2px 4px; box-shadow: 0 2px 6px rgba(27, 32, 56, 0.05); }
  .np-tool-btn { display:inline-flex; align-items:center; justify-content:center; width:24px; height:22px;
                 border:0; border-radius:5px; background:transparent; color:${ft.muted}; cursor:pointer;
                 transition: background .12s, color .12s; }
  .np-tool-btn:hover:not(:disabled) { background:${ft.indigoSoft}; color:${ft.indigo}; }
  .np-tool-btn:disabled { opacity:0.35; cursor:not-allowed; }
  .np-tool-sep { width:1px; height:14px; background:${ft.line}; margin:0 2px; }

  /* Tr\xECnh so\u1EA1n th\u1EA3o Outliner h\u1ED7 tr\u1EE3 g\u1EA1ch \u0111\u1EA7u d\xF2ng ph\xE2n c\u1EA5p & \u0111\u01B0\u1EDDng k\u1EBB d\u1ECDc */
  .np-editor { width:100%; min-height:42px; padding:9px 12px; border:1px solid ${ft.line}; border-radius:9px;
               background:${ft.field}; transition: border-color .15s, box-shadow .15s, background .15s;
               cursor:text; word-break:break-word; outline:none; line-height:1.55; }
  .np-editor.multiline { min-height:92px; }
  .np-editor:hover { border-color:#cfd4e8; }
  .np-editor:focus { background:#fff; border-color:${ft.indigo}; box-shadow:0 0 0 3px ${ft.indigoSoft}; }
  .np-editor:empty::before { content: attr(data-placeholder); color: #9aa2c4; pointer-events: none; font-size: 13.5px; }

  .np-editor ul { margin: 2px 0; padding-left: 20px; list-style-type: disc; }
  .np-editor ul ul { margin: 3px 0 3px 4px; padding-left: 18px; border-left: 1.5px solid #d4d9ec; list-style-type: disc; }
  .np-editor li { margin: 2px 0; }
  .np-editor li::marker { color: ${ft.muted}; font-size: 0.9em; }

  .np-btn { display:inline-flex; align-items:center; gap:10px; height:44px; padding:0 20px; border:0;
            border-radius:11px; background:${ft.indigo}; color:#fff; font-weight:600; cursor:pointer;
            box-shadow:0 8px 18px -8px ${ft.indigo}; transition: transform .15s, background .15s; }
  .np-btn:hover { background:#4144c4; transform:translateY(-1px); }
  .np button:focus-visible { outline:3px solid ${ft.indigoSoft}; outline-offset:2px; box-shadow:0 0 0 2px ${ft.indigo}; }

  .np-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:16px; }
  @media (max-width: 1100px) { .np-grid { grid-template-columns: 1fr; } }
  @media (max-width: 768px) {
    .np-shell { flex-direction: column !important; }
    .np-sidebar { width: 100% !important; flex-direction: row !important; overflow-x: auto; padding: 12px !important; border-right: 0 !important; border-bottom: 1px solid ${ft.line}; }
    .np-logo { display: none !important; }
    .np-nav { width: auto; white-space: nowrap; }

    background: transparent;
    color: ${j.ink};
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s ease;
  }

  .np-edit-info-btn:hover {
    background: #f4f6fc;
    border-color: ${j.line};
  }

  .np-edit-info-badge {
    width: 54px;
    height: 18px;
    border-radius: 4px;
    background: #8c92a4;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    transition: background 0.15s ease;
  }

  .np-edit-info-btn:hover .np-edit-info-badge {
    background: ${j.indigo};
  }

  .np-node {
    cursor: pointer;
    outline: none;
  }

  .np-node .np-pill {
    transition: fill 0.16s ease, stroke 0.16s ease;
  }

  .np-node:hover .np-pill {
    filter: brightness(0.97);
  }

  .np-node:focus-visible .np-pill {
    stroke: ${j.indigo};
    stroke-width: 2px;
  }

  /* B\u1ED1 c\u1EE5c 2 kh\u1ED1i c\xE2n b\u1EB1ng \u1EDF ch\xEDnh gi\u1EEFa b\xEAn d\u01B0\u1EDBi khung hi\u1EC3n th\u1ECB Tree */
  .np-bottom {
    display: grid;
    grid-template-columns: repeat(2, minmax(0, 1fr));
    align-items: stretch;
    gap: 32px;
    width: 100%;
    max-width: 980px;
    margin: 0 auto;
  }

  .np-bottom-card {
    background: ${j.panel};
    border: 1px solid ${j.line};
    border-radius: 12px;
    padding: 24px 26px;
    min-height: 380px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .np-tree-viewport {
    width: 100%;
    overflow-x: auto;
    overflow-y: hidden;
    cursor: grab;
    user-select: none;
    border-radius: 10px;
    padding-bottom: 6px;
  }

  .np-tree-viewport.is-dragging {
    cursor: grabbing;
  }

  .np-tree-viewport::-webkit-scrollbar {
    height: 8px;
  }

  .np-tree-viewport::-webkit-scrollbar-track {
    background: #f4f6fc;
    border-radius: 99px;
  }

  .np-tree-viewport::-webkit-scrollbar-thumb {
    background: #c5cde6;
    border-radius: 99px;
  }

  .np-tree-viewport::-webkit-scrollbar-thumb:hover {
    background: #9faad0;
  }

  @media (max-width: 920px) {
    .np-bottom {
      grid-template-columns: 1fr;
      max-width: 560px;
      gap: 20px;
    }

    .np-bottom-card {
      min-height: auto;
    }
  }

  .np-tree-scroll {
    margin-top: 12px;
    max-height: 290px;
    overflow-y: auto;
    padding-right: 4px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .np-tree-scroll::-webkit-scrollbar {
    width: 6px;
  }

  .np-tree-scroll::-webkit-scrollbar-thumb {
    background: #ccd2e8;
    border-radius: 99px;
  }

  .np-tree-row {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: 5px 8px;
    border-radius: 9px;
    border: 1px solid ${j.line};
    background: #ffffff;
    transition: border-color 0.15s ease, background 0.15s ease, box-shadow 0.15s ease;
  }

  .np-tree-row:hover {
    border-color: #c5cde8;
  }

  .np-tree-row.is-selected {
    border-color: ${j.indigo};
    box-shadow: 0 0 0 2px rgba(79, 82, 217, 0.12);
  }

  .np-mini-icon {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: ${j.muted};
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
  }

  .np-mini-icon:hover {
    background: #f4f6fc;
    color: ${j.ink};
  }

  .np-role-pill {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 4px;
    height: 24px;
    padding: 0 8px;
    border-radius: 999px;
    border: 1px solid ${j.line};
    background: #f7f8fc;
    color: ${j.muted};
    font-size: 11.5px;
    font-weight: 600;
    white-space: nowrap;
    cursor: pointer;
    flex-shrink: 0;
    transition: all 0.15s ease;
  }

  .np-role-pill:hover {
    border-color: #c6cde6;
    color: ${j.ink};
  }

  .np-role-pill.is-core {
    background: ${j.tealSoft};
    border-color: #a4e4de;
    color: #0b8579;
  }

  .np-row-input {
    flex: 1;
    min-width: 60px;
    border: none;
    background: transparent;
    color: ${j.ink};
    font-size: 13px;
    font-weight: 500;
    padding: 3px 4px;
    outline: none;
  }

  .np-row-input::placeholder {
    color: #9aa2c2;
    font-style: italic;
  }

  .np-add-circle-btn {
    width: 22px;
    height: 22px;
    border-radius: 999px;
    border: 1px solid #cfd5ee;
    background: #f7f8fc;
    color: ${j.indigo};
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: all 0.14s ease;
  }

  .np-add-circle-btn:hover {
    background: ${j.indigo};
    border-color: ${j.indigo};
    color: #ffffff;
  }

  .np-del-btn {
    width: 22px;
    height: 22px;
    border-radius: 6px;
    border: none;
    background: transparent;
    color: ${j.muted};
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    flex-shrink: 0;
    padding: 0;
    transition: all 0.14s ease;
  }

  .np-del-btn:hover {
    background: ${j.coralSoft};
    color: ${j.coral};
  }

  .np-input {
    width: 100%;
    border: 1px solid ${j.line};
    background: #ffffff;
    color: ${j.ink};
    border-radius: 10px;
    padding: 9px 12px;
    font-size: 14px;
    outline: none;
    transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
  }

  input.np-input {
    height: 40px;
  }

  textarea.np-input {
    min-height: 120px;
    resize: vertical;
    line-height: 1.5;
  }

  .np-input:focus {
    background: #ffffff;
    border-color: ${j.indigo};
    box-shadow: 0 0 0 3px rgba(79, 82, 217, 0.12);
  }

    .og, .og * {
      box-sizing: border-box;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
    }
    .og {
      color: ${G.text};
      -webkit-font-smoothing: antialiased;
      height: 100vh;
      overflow: hidden;
    }
    @media (max-width: 860px) {
      .og {
        height: auto;
        min-height: 100vh;
        overflow: visible;
      }
    }
    .og-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      height: 34px;
      padding: 0 12px;
      border-radius: 10px;
      border: 1px solid ${G.line};
      background: ${G.card};
      color: ${G.ink};
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .og-btn:hover {
      background: #f5f7fc;
      border-color: #cfd5ea;
    }
    .og-btn[aria-checked="true"] {
      background: ${G.indigoSoft};
      border-color: ${G.indigo};
      color: ${G.indigo};
    }
    .og-stage-tab {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      height: 30px;
      padding: 0 12px;
      border-radius: 999px;
      border: 1px solid ${G.line};
      background: #fff;
      color: ${G.muted};
      font-size: 12.5px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s ease;
    }
    .og-stage-tab:hover {
      border-color: #c5cde8;
      color: ${G.ink};
    }
    .og-stage-tab.is-active {
      background: ${G.indigo};
      border-color: ${G.indigo};
      color: #ffffff;
    }
    .og-input {
      width: 100%;
      height: 36px;
      padding: 0 11px;
      border: 1px solid ${G.line};
      border-radius: 9px;
      background: #ffffff;
      color: ${G.ink};
      font-size: 13.5px;
      transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    textarea.og-input {
      height: auto;
      min-height: 52px;
      padding: 7px 11px;
      resize: vertical;
      line-height: 1.4;
    }
    .og-input:focus {
      outline: none;
      border-color: ${G.indigo};
      box-shadow: 0 0 0 3px rgba(79, 82, 217, 0.12);
    }
    .og-workspace {
      display: flex;
      flex-direction: column;
      gap: 14px;
      height: 100%;
      min-height: 0;
    }
    .og-tree-section {
      background: ${G.card};
      border: 1px solid ${G.line};
      border-radius: 14px;
      padding: 12px 18px 14px;
      flex: 0 0 auto;
      display: flex;
      flex-direction: column;
    }
    .og-tree-scroll {
      width: 100%;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 6px 4px;
      scrollbar-width: thin;
      scrollbar-color: #cbd2e8 transparent;
    }
    .og-tree-scroll::-webkit-scrollbar {
      height: 6px;
    }
    .og-tree-scroll::-webkit-scrollbar-thumb {
      background: #cbd2e8;
      border-radius: 999px;
    }
    .og-bottom-grid {
      display: grid;

  .np button, .np input, .np textarea, .np select { font-family: inherit; font-size: inherit; color: inherit; }

  .np-nav { display: flex; align-items: center; gap: 12px; width: 100%; height: 42px; padding: 0 12px; border: 0; border-radius: 10px; background: transparent; color: ${C.muted}; font-weight: 500; text-align: left; cursor: pointer; transition: background .15s, color .15s; white-space: nowrap; overflow: hidden; }
  .np-nav:hover { background: #fff; color: ${C.ink}; }
  .np-nav[aria-current="page"] { background: ${C.indigoSoft}; color: ${C.indigo}; font-weight: 600; }

  .np-back-btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 40px; padding: 0 12px; border: 0; border-radius: 11px; background: linear-gradient(135deg, ${C.indigo}, ${C.violet}); color: #fff; font-size: 13px; font-weight: 600; cursor: pointer; box-shadow: 0 8px 18px -8px ${C.indigo}; transition: transform .15s, filter .15s, width .2s; white-space: nowrap; overflow: hidden; }
  .np-back-btn:hover { filter: brightness(1.07); transform: translateY(-1px); }
  .np-back-btn:active { transform: translateY(0); }

  .np-icon-btn { display: inline-flex; align-items: center; justify-content: center; width: 32px; height: 32px; padding: 0; border: 1px solid ${C.line}; border-radius: 8px; background: #fff; color: ${C.muted}; cursor: pointer; transition: background .15s, color .15s, border-color .15s; flex: none; }
  .np-icon-btn:hover { background: ${C.indigoSoft}; border-color: #c9caf3; color: ${C.indigo}; }

  .np-card { background: ${C.card}; border: 1px solid ${C.line}; border-radius: 14px; padding: 20px; }
  .np-card-head { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px; margin-bottom: 16px; }
  .np-title { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 16px; font-weight: 600; color: ${C.ink}; }
  .np-sq { width: 10px; height: 10px; border-radius: 3px; flex: none; }
  .np-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .np-note { font-size: 13px; color: ${C.muted}; }
  .np-label { display: block; margin-bottom: 6px; font-size: 13px; font-weight: 500; color: ${C.text}; }

  .np-btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid ${C.line}; border-radius: 10px; background: #fff; color: ${C.ink}; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  .np-btn:hover, .np-btn.on { background: ${C.indigoSoft}; border-color: #c9caf3; color: ${C.indigo}; }
  .np-btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
  .np-btn.primary { background: ${C.indigo}; border-color: ${C.indigo}; color: #fff; box-shadow: 0 8px 18px -8px ${C.indigo}; }
  .np-btn.primary:hover { background: #4144c4; color: #fff; }
  .np-select-btn { height: 32px; padding: 0 10px; border: 1px solid ${C.line}; border-radius: 9px; background: #fff; color: ${C.ink}; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
  .np-select-btn:hover { background: ${C.indigoSoft}; border-color: #c9caf3; color: ${C.indigo}; }
  .np-select-btn:focus { outline: none; border-color: ${C.indigo}; box-shadow: 0 0 0 3px ${C.indigoSoft}; }

  .np-input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid ${C.line}; border-radius: 9px; background: ${C.field}; transition: border-color .15s, box-shadow .15s, background .15s; }
  select.np-input { cursor: pointer; font-weight: 600; color: ${C.ink}; }
  textarea.np-input { height: auto; min-height: 84px; padding: 10px 12px; resize: vertical; }
  .np-input:hover { border-color: #cfd4e8; }
  .np-input:focus { outline: none; background: #fff; border-color: ${C.indigo}; box-shadow: 0 0 0 3px ${C.indigoSoft}; }
  .np button:focus-visible { outline: 3px solid ${C.indigoSoft}; outline-offset: 2px; box-shadow: 0 0 0 2px ${C.indigo}; }

  .np-tag { display: inline-block; padding: 2px 8px; border: 1px solid; border-radius: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; }
  .np-chip { display: inline-block; padding: 2px 8px; border: 1px solid ${C.line}; border-radius: 6px; background: ${C.field}; font-size: 12px; font-weight: 600; color: ${C.muted}; }

  .np-table-wrap { width: 100%; overflow-x: auto; border: 1px solid ${C.line}; border-radius: 11px; background: #fff; }
  .np-table { width: 100%; border-collapse: collapse; font-size: 14px; text-align: left; }
  .np-table th { background: ${C.field}; color: ${C.muted}; font-weight: 600; font-size: 13px; padding: 10px 12px; border-bottom: 1px solid ${C.line}; border-right: 1px solid ${C.line}; white-space: nowrap; }
  .np-table td { padding: 0; border-bottom: 1px solid ${C.line}; border-right: 1px solid ${C.line}; }
  .np-table th:last-child, .np-table td:last-child { border-right: 0; }
  .np-table tr:last-child td { border-bottom: 0; }
  .np-table tr:hover td { background: ${C.field}; }
  .np-table tr.selected td { background: ${C.indigoSoft}; }
  .np-cell-input { width: 100%; height: 40px; padding: 0 12px; border: 0; background: transparent; font-size: 14px; color: ${C.ink}; }
  .np-cell-input:focus { outline: none; background: #fff; box-shadow: inset 0 0 0 2px ${C.indigo}; }

  .np-flow { width: 100%; max-width: 520px; }
  .np-flow-pair { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px; }
  .np-flow-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 16px; width: 100%; max-width: 680px; }
  .np-node { background: #fff; border: 1px solid ${C.line}; border-radius: 12px; padding: 12px 16px; transition: border-color .15s, box-shadow .15s, background .15s; }
  .np-node:hover { border-color: ${C.indigo}; }
  .np-node.drop-ready { border-style: dashed; border-color: ${C.indigo}; background: #f4f5ff; }
  .np-node.drop-over { border-style: solid; border-color: ${C.coral}; background: #fff5f5; box-shadow: 0 0 0 3px rgba(240, 82, 79, 0.16); }

  .np-side-sec { display: flex; flex-direction: column; min-height: 0; overflow-y: auto; padding: 16px; transition: flex .2s ease; }
  .np-side-sec + .np-side-sec { border-top: 1px solid ${C.line}; }
  .np-var { padding: 10px 12px; border: 1px solid ${C.line}; border-radius: 11px; background: ${C.field}; cursor: grab; user-select: none; transition: border-color .15s, background .15s, transform .15s, box-shadow .15s; }
  .np-var:hover { border-color: #c9caf3; background: #fff; box-shadow: 0 4px 12px -6px rgba(27, 32, 56, 0.25); transform: translateY(-1px); }
  .np-var:active { cursor: grabbing; transform: scale(0.99); }
  .np-var.dragging { opacity: 0.55; border-style: dashed; border-color: ${C.indigo}; }
  .np-fcard { width: 100%; padding: 11px 13px; text-align: left; border: 1px solid ${C.line}; border-radius: 11px; background: #fff; color: ${C.ink}; cursor: pointer; transition: background .15s, border-color .15s; }
  .np-fcard:hover { background: ${C.field}; border-color: #c9caf3; }
  .np-fcard[aria-pressed="true"] { background: ${C.indigoSoft}; border-color: ${C.indigo}; color: ${C.indigo}; }

  .np-overlay { position: fixed; inset: 0; z-index: 1000; display: flex; align-items: center; justify-content: center; padding: 20px; background: rgba(27, 32, 56, 0.45); }
  .np-modal { width: 100%; padding: 22px; border: 1px solid ${C.line}; border-radius: 14px; background: #fff; }
  .np-two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .np-toast { position: fixed; bottom: 20px; right: 300px; z-index: 1100; display: flex; align-items: center; gap: 8px; padding: 10px 16px; border-radius: 10px; background: ${C.ink}; color: #fff; font-size: 13px; font-weight: 500; }
